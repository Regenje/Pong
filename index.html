<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pong</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0d12; color: #e8ecf1; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; overflow: hidden; touch-action: none; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 12px; }
  canvas { background: #11141b; border: 2px solid #232836; border-radius: 6px; max-width: 100%; max-height: calc(100% - 70px); aspect-ratio: 16 / 10; width: 960px; display: block; }
  .help { font-size: 13px; color: #7d8597; text-align: center; line-height: 1.6; }
  kbd { background: #1c2030; border: 1px solid #2c3246; border-radius: 4px; padding: 1px 6px; color: #c9d1e0; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="game" width="960" height="600"></canvas>
  <div class="help">
    <kbd>W</kbd>/<kbd>S</kbd> ou <kbd>↑</kbd>/<kbd>↓</kbd> ou souris/doigt pour bouger &nbsp;·&nbsp;
    <kbd>Espace</kbd> pause &nbsp;·&nbsp; <kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> difficulté &nbsp;·&nbsp; premier à 7
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const WIN_SCORE = 7;
  const PADDLE_W = 14, PADDLE_H = 100, PADDLE_MARGIN = 28, PADDLE_SPEED = 520;
  const BALL_R = 9, BALL_START_SPEED = 420, BALL_MAX_SPEED = 1100, SPEEDUP = 1.06;
  const LEVELS = { 1: { name: 'Facile', ai: 300, err: 60 }, 2: { name: 'Normal', ai: 420, err: 30 }, 3: { name: 'Difficile', ai: 560, err: 10 } };

  let level = 2;
  const player = { x: PADDLE_MARGIN, y: H / 2 - PADDLE_H / 2, score: 0 };
  const ai = { x: W - PADDLE_MARGIN - PADDLE_W, y: H / 2 - PADDLE_H / 2, score: 0, target: H / 2 };
  const ball = { x: W / 2, y: H / 2, vx: 0, vy: 0 };

  let state = 'menu'; // menu | serve | play | pause | over
  let serveTimer = 0, serveDir = 1, winner = '';
  const keys = {};
  let pointerY = null;

  // --- Son (WebAudio, généré à la volée) ---
  let audio = null;
  function beep(freq, dur = 0.05, type = 'square', vol = 0.08) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) { /* pas de son, tant pis */ }
  }

  function resetBall(dir) {
    ball.x = W / 2; ball.y = H / 2; ball.vx = 0; ball.vy = 0;
    serveDir = dir; serveTimer = 0.9; state = 'serve';
  }
  function launch() {
    const angle = (Math.random() * 0.8 - 0.4);
    ball.vx = Math.cos(angle) * BALL_START_SPEED * serveDir;
    ball.vy = Math.sin(angle) * BALL_START_SPEED;
    state = 'play';
  }
  function newGame() {
    player.score = 0; ai.score = 0;
    player.y = ai.y = H / 2 - PADDLE_H / 2;
    resetBall(Math.random() < 0.5 ? -1 : 1);
  }

  // --- Entrées ---
  addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (['arrowup', 'arrowdown', ' '].includes(e.key.toLowerCase())) e.preventDefault();
    if (e.key === ' ' || e.key === 'Enter') {
      if (state === 'menu' || state === 'over') newGame();
      else if (state === 'play') state = 'pause';
      else if (state === 'pause') state = 'play';
    }
    if (LEVELS[e.key]) level = +e.key;
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  function toCanvasY(clientY) {
    const r = canvas.getBoundingClientRect();
    return (clientY - r.top) * (H / r.height);
  }
  canvas.addEventListener('pointermove', e => { pointerY = toCanvasY(e.clientY); });
  canvas.addEventListener('pointerdown', e => {
    pointerY = toCanvasY(e.clientY);
    if (state === 'menu' || state === 'over') newGame();
    else if (state === 'pause') state = 'play';
  });
  canvas.addEventListener('pointerleave', () => { pointerY = null; });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // --- Mise à jour ---
  function update(dt) {
    // Joueur
    let dy = 0;
    if (keys['w'] || keys['z'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (dy !== 0) { player.y += dy * PADDLE_SPEED * dt; pointerY = null; }
    else if (pointerY !== null) {
      const target = pointerY - PADDLE_H / 2;
      player.y += clamp(target - player.y, -PADDLE_SPEED * 1.6 * dt, PADDLE_SPEED * 1.6 * dt);
    }
    player.y = clamp(player.y, 0, H - PADDLE_H);

    if (state === 'serve') {
      serveTimer -= dt;
      if (serveTimer <= 0) launch();
    }
    if (state !== 'play' && state !== 'serve') return;

    // IA : suit la balle quand elle vient vers elle, sinon revient au centre
    const L = LEVELS[level];
    if (ball.vx > 0) ai.target = ball.y + (Math.sin(performance.now() / 400) * L.err);
    else ai.target = H / 2;
    const center = ai.y + PADDLE_H / 2;
    ai.y += clamp(ai.target - center, -L.ai * dt, L.ai * dt);
    ai.y = clamp(ai.y, 0, H - PADDLE_H);

    if (state !== 'play') return;

    // Balle (sous-pas pour éviter de traverser les raquettes à grande vitesse)
    const steps = Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / (BALL_R * 0.8));
    const sdt = dt / steps;
    for (let i = 0; i < steps; i++) {
      ball.x += ball.vx * sdt;
      ball.y += ball.vy * sdt;

      if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); beep(300, 0.03); }
      if (ball.y + BALL_R > H) { ball.y = H - BALL_R; ball.vy = -Math.abs(ball.vy); beep(300, 0.03); }

      if (ball.vx < 0) hitPaddle(player, 1);
      else hitPaddle(ai, -1);

      if (ball.x < -BALL_R * 2) { ai.score++; beep(160, 0.25, 'sawtooth'); return scored(); }
      if (ball.x > W + BALL_R * 2) { player.score++; beep(660, 0.12, 'triangle'); beep(880, 0.2, 'triangle'); return scored(); }
    }
  }

  function hitPaddle(p, dir) {
    if (ball.x - BALL_R < p.x + PADDLE_W && ball.x + BALL_R > p.x &&
        ball.y + BALL_R > p.y && ball.y - BALL_R < p.y + PADDLE_H) {
      // L'angle de rebond dépend de l'endroit où la balle touche la raquette
      const rel = clamp((ball.y - (p.y + PADDLE_H / 2)) / (PADDLE_H / 2), -1, 1);
      const angle = rel * (Math.PI / 3.2);
      const speed = Math.min(Math.hypot(ball.vx, ball.vy) * SPEEDUP, BALL_MAX_SPEED);
      ball.vx = Math.cos(angle) * speed * dir;
      ball.vy = Math.sin(angle) * speed;
      ball.x = dir > 0 ? p.x + PADDLE_W + BALL_R : p.x - BALL_R;
      beep(dir > 0 ? 520 : 440, 0.04);
    }
  }

  function scored() {
    if (player.score >= WIN_SCORE || ai.score >= WIN_SCORE) {
      winner = player.score > ai.score ? 'Tu as gagné !' : "L'ordi a gagné";
      state = 'over';
      if (player.score > ai.score) [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.15, 'triangle'), i * 120));
    } else {
      resetBall(ball.x < 0 ? 1 : -1);
    }
  }

  // --- Rendu ---
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // filet
    ctx.fillStyle = '#232836';
    for (let y = 10; y < H; y += 30) ctx.fillRect(W / 2 - 2, y, 4, 16);

    // scores
    ctx.fillStyle = '#3a4258';
    ctx.font = 'bold 72px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(player.score, W / 2 - 90, 90);
    ctx.fillText(ai.score, W / 2 + 90, 90);

    // raquettes
    ctx.fillStyle = '#5eead4';
    roundRect(player.x, player.y, PADDLE_W, PADDLE_H, 5);
    ctx.fillStyle = '#f472b6';
    roundRect(ai.x, ai.y, PADDLE_W, PADDLE_H, 5);

    // balle
    if (state === 'play' || state === 'serve' || state === 'pause') {
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2); ctx.fill();
    }

    // niveau
    ctx.font = '14px ui-monospace, Menlo, monospace';
    ctx.fillStyle = '#5b6478';
    ctx.textAlign = 'right';
    ctx.fillText('Niveau : ' + LEVELS[level].name, W - 16, H - 14);

    // overlays
    if (state === 'menu') overlay('PONG', 'Espace ou clic pour jouer');
    if (state === 'pause') overlay('Pause', 'Espace ou clic pour reprendre');
    if (state === 'over') overlay(winner, `${player.score} – ${ai.score}  ·  Espace ou clic pour rejouer`);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();
  }
  function overlay(title, sub) {
    ctx.fillStyle = 'rgba(11,13,18,0.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 64px ui-monospace, Menlo, monospace';
    ctx.fillText(title, W / 2, H / 2 - 10);
    ctx.fillStyle = '#9aa3b5';
    ctx.font = '20px ui-monospace, Menlo, monospace';
    ctx.fillText(sub, W / 2, H / 2 + 36);
  }

  // --- Boucle ---
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
